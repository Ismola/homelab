---
- name: Upgrade de servidores Debian/Ubuntu
  hosts: all
  become: true
  serial: 1

  tasks:
    - name: Saltar hosts que no sean Debian/Ubuntu
      ansible.builtin.meta: end_host
      when: ansible_facts.os_family != "Debian"

    - name: Buscar ficheros de repositorios APT
      ansible.builtin.find:
        paths:
          - /etc/apt
        patterns:
          - "*.list"
        recurse: true
        file_type: file
      register: apt_source_files

    - name: Eliminar repo obsoleto de Neofetch en Bintray
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: '.*dl\.bintray\.com/dawidd6/neofetch.*'
        state: absent
        backup: true
      loop: "{{ apt_source_files.files }}"

    - name: Finalizar configuraciones dpkg pendientes
      ansible.builtin.command: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: dpkg_configure
      changed_when: >
        'Setting up' in dpkg_configure.stdout or
        'Configurando' in dpkg_configure.stdout or
        'Setting up' in dpkg_configure.stderr or
        'Configurando' in dpkg_configure.stderr

    - name: Corregir dependencias rotas si las hay
      ansible.builtin.apt:
        state: fixed

    - name: Actualizar la caché de paquetes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        update_cache_retries: 5
        update_cache_retry_max_delay: 12

    - name: Realizar upgrade seguro
      ansible.builtin.apt:
        upgrade: safe
        autoremove: true

    - name: Comprobar si se requiere reinicio
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reiniciar si es necesario
      ansible.builtin.reboot:
        msg: "Reinicio iniciado por Ansible tras actualizaciones"
        reboot_timeout: 900
      when: reboot_required_file.stat.exists