---
- name: Release upgrade completo Ubuntu/Debian
  hosts: all
  become: true
  gather_facts: true
  serial: "{{ upgrade_serial | default(1) }}"

  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a

  vars:
    release_upgrade: true

    # Ubuntu:
    # lts    = solo saltos LTS, por ejemplo 22.04 -> 24.04
    # normal = cualquier release soportada
    ubuntu_release_prompt: lts

    # Debian:
    # Puedes forzarlo con:
    # ansible-playbook maintenance/upgrade.yml -e debian_target_release=trixie
    debian_release_map:
      bullseye: bookworm
      bookworm: trixie

    debian_components: "main contrib non-free non-free-firmware"

    apt_lock_timeout_seconds: 1800
    apt_lock_check_interval_seconds: 10

    apt_lock_files:
      - /var/lib/dpkg/lock-frontend
      - /var/lib/dpkg/lock
      - /var/cache/apt/archives/lock
      - /var/lib/apt/lists/lock

  tasks:
    #####################################################################
    # VALIDACIÓN INICIAL
    #####################################################################

    - name: Validar sistema soportado
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
        fail_msg: "Sistema no soportado: {{ ansible_facts['distribution'] }}"

    - name: Mostrar versión actual
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Distribución: {{ ansible_facts['distribution'] }}"
          - "Versión: {{ ansible_facts['distribution_version'] }}"
          - "Codename: {{ ansible_facts['distribution_release'] }}"

    #####################################################################
    # BLOQUEO APT / DPKG
    #####################################################################

    - name: Esperar a que se liberen locks de APT/DPKG
      ansible.builtin.shell: |
        set -o pipefail

        locks="{{ apt_lock_files | join(' ') }}"
        end=$((SECONDS + {{ apt_lock_timeout_seconds }}))

        while fuser $locks >/dev/null 2>&1; do
          echo "APT/DPKG ocupado. Procesos con lock:"
          fuser -v $locks || true

          if [ "$SECONDS" -ge "$end" ]; then
            echo "Timeout esperando locks de APT/DPKG."
            echo "Procesos relacionados:"
            ps -eo pid,ppid,stat,comm,args | grep -E 'apt|apt-get|dpkg|unattended|do-release-upgrade|noble' | grep -v grep || true
            exit 1
          fi

          sleep {{ apt_lock_check_interval_seconds }}
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Parar timers automáticos de APT durante el mantenimiento
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Esperar de nuevo a que no haya locks tras parar timers
      ansible.builtin.shell: |
        set -o pipefail

        locks="{{ apt_lock_files | join(' ') }}"
        end=$((SECONDS + {{ apt_lock_timeout_seconds }}))

        while fuser $locks >/dev/null 2>&1; do
          echo "APT/DPKG sigue ocupado. Procesos con lock:"
          fuser -v $locks || true

          if [ "$SECONDS" -ge "$end" ]; then
            echo "Timeout esperando locks de APT/DPKG."
            ps -eo pid,ppid,stat,comm,args | grep -E 'apt|apt-get|dpkg|unattended|do-release-upgrade|noble' | grep -v grep || true
            exit 1
          fi

          sleep {{ apt_lock_check_interval_seconds }}
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Reparar dpkg si quedó una operación interrumpida
      ansible.builtin.command: dpkg --configure -a
      register: dpkg_configure_result
      changed_when: dpkg_configure_result.stdout | length > 0
      failed_when: dpkg_configure_result.rc != 0

    - name: Reparar dependencias rotas si las hubiera
      ansible.builtin.apt:
        state: fixed
        lock_timeout: 600
        force_apt_get: true

    #####################################################################
    # UPGRADE DE PAQUETES EN LA RELEASE ACTUAL
    #####################################################################

    - name: Actualizar caché APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        update_cache_retries: 5
        update_cache_retry_max_delay: 30
        lock_timeout: 600
        force_apt_get: true

    - name: Actualizar paquetes de la release actual antes del salto
      ansible.builtin.apt:
        upgrade: dist
        dpkg_options: "force-confdef,force-confold"
        lock_timeout: 900
        force_apt_get: true

    - name: Limpiar paquetes no necesarios antes del salto
      ansible.builtin.apt:
        autoremove: true
        purge: true
        lock_timeout: 600
        force_apt_get: true

    - name: Comprobar si se requiere reinicio antes del salto
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: pre_release_reboot_required

    - name: Reiniciar antes del salto si es necesario
      ansible.builtin.reboot:
        msg: "Reinicio previo al release upgrade iniciado por Ansible"
        reboot_timeout: 1800
        post_reboot_delay: 30
        test_command: "whoami"
      when: pre_release_reboot_required.stat.exists

    - name: Refrescar facts tras reinicio previo
      ansible.builtin.setup:

    #####################################################################
    # UBUNTU RELEASE UPGRADE
    #####################################################################

    - name: Instalar herramientas de release upgrade en Ubuntu
      ansible.builtin.apt:
        name:
          - update-manager-core
          - ubuntu-release-upgrader-core
        state: present
        update_cache: true
        lock_timeout: 600
        force_apt_get: true
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Ubuntu'

    - name: Configurar política de release upgrade en Ubuntu
      ansible.builtin.lineinfile:
        path: /etc/update-manager/release-upgrades
        regexp: '^Prompt='
        line: "Prompt={{ ubuntu_release_prompt }}"
        create: true
        mode: "0644"
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Ubuntu'

    - name: Comprobar si existe una nueva release de Ubuntu
      ansible.builtin.command: do-release-upgrade -c
      register: ubuntu_release_check
      changed_when: false
      failed_when: false
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Ubuntu'

    - name: Mostrar resultado de comprobación de nueva release Ubuntu
      ansible.builtin.debug:
        msg: "{{ ubuntu_release_check.stdout_lines + ubuntu_release_check.stderr_lines }}"
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Ubuntu'

    - name: Esperar locks antes de do-release-upgrade en Ubuntu
      ansible.builtin.shell: |
        set -o pipefail

        locks="{{ apt_lock_files | join(' ') }}"
        end=$((SECONDS + {{ apt_lock_timeout_seconds }}))

        while fuser $locks >/dev/null 2>&1; do
          echo "APT/DPKG ocupado antes de do-release-upgrade:"
          fuser -v $locks || true

          if [ "$SECONDS" -ge "$end" ]; then
            echo "Timeout esperando locks antes de do-release-upgrade."
            ps -eo pid,ppid,stat,comm,args | grep -E 'apt|apt-get|dpkg|unattended|do-release-upgrade|noble' | grep -v grep || true
            exit 1
          fi

          sleep {{ apt_lock_check_interval_seconds }}
        done
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Ubuntu'

    - name: Ejecutar release upgrade en Ubuntu
      ansible.builtin.command: do-release-upgrade -f DistUpgradeViewNonInteractive
      register: ubuntu_release_upgrade_result
      changed_when: "'No new release found' not in (ubuntu_release_upgrade_result.stdout + ubuntu_release_upgrade_result.stderr)"
      failed_when:
        - ubuntu_release_upgrade_result.rc != 0
        - "'No new release found' not in (ubuntu_release_upgrade_result.stdout + ubuntu_release_upgrade_result.stderr)"
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Ubuntu'

    #####################################################################
    # DEBIAN RELEASE UPGRADE
    #####################################################################

    - name: Calcular release objetivo de Debian
      ansible.builtin.set_fact:
        debian_target_release_final: >-
          {{
            debian_target_release
            | default(debian_release_map[ansible_facts['distribution_release']] | default(''))
          }}
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Validar release objetivo de Debian
      ansible.builtin.assert:
        that:
          - debian_target_release_final | length > 0
          - debian_target_release_final != ansible_facts['distribution_release']
        fail_msg: >-
          No se ha definido una release objetivo válida para Debian.
          Release actual: {{ ansible_facts['distribution_release'] }}.
          Usa, por ejemplo:
          -e debian_target_release=trixie
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Backup de repositorios APT en Debian
      ansible.builtin.shell: |
        set -e
        backup="/root/apt-sources-pre-release-upgrade-{{ ansible_date_time.iso8601_basic_short }}.tgz"
        tar -czf "$backup" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
        echo "$backup"
      args:
        executable: /bin/bash
      register: debian_apt_backup
      changed_when: true
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Mostrar backup de repositorios Debian
      ansible.builtin.debug:
        msg: "Backup APT creado en: {{ debian_apt_backup.stdout }}"
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Desactivar repositorios de terceros en Debian
      ansible.builtin.shell: |
        set -e
        mkdir -p /etc/apt/sources.list.d/disabled-by-ansible-release-upgrade

        find /etc/apt/sources.list.d \
          -maxdepth 1 \
          -type f \
          \( -name "*.list" -o -name "*.sources" \) \
          ! -name "ansible-debian-release.sources" \
          -exec mv -t /etc/apt/sources.list.d/disabled-by-ansible-release-upgrade {} + 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Vaciar sources.list principal en Debian
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        mode: "0644"
        content: |
          # Gestionado por Ansible durante release upgrade.
          # Repositorios activos en:
          # /etc/apt/sources.list.d/ansible-debian-release.sources
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Crear repositorios oficiales de Debian para la nueva release
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ansible-debian-release.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://deb.debian.org/debian
          Suites: {{ debian_target_release_final }} {{ debian_target_release_final }}-updates
          Components: {{ debian_components }}
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://security.debian.org/debian-security
          Suites: {{ debian_target_release_final }}-security
          Components: {{ debian_components }}
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Esperar locks antes de actualizar repositorios Debian
      ansible.builtin.shell: |
        set -o pipefail

        locks="{{ apt_lock_files | join(' ') }}"
        end=$((SECONDS + {{ apt_lock_timeout_seconds }}))

        while fuser $locks >/dev/null 2>&1; do
          echo "APT/DPKG ocupado antes del release upgrade Debian:"
          fuser -v $locks || true

          if [ "$SECONDS" -ge "$end" ]; then
            echo "Timeout esperando locks antes del release upgrade Debian."
            ps -eo pid,ppid,stat,comm,args | grep -E 'apt|apt-get|dpkg|unattended' | grep -v grep || true
            exit 1
          fi

          sleep {{ apt_lock_check_interval_seconds }}
        done
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Actualizar caché APT permitiendo cambio de release en Debian
      ansible.builtin.command: apt-get update --allow-releaseinfo-change
      register: debian_apt_update_release
      changed_when: false
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Upgrade mínimo inicial de Debian
      ansible.builtin.command: >
        apt-get -y
        -o Dpkg::Options::=--force-confdef
        -o Dpkg::Options::=--force-confold
        upgrade
      register: debian_minimal_upgrade
      changed_when: true
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    - name: Dist-upgrade completo de Debian
      ansible.builtin.command: >
        apt-get -y
        -o Dpkg::Options::=--force-confdef
        -o Dpkg::Options::=--force-confold
        dist-upgrade
      register: debian_dist_upgrade
      changed_when: true
      when:
        - release_upgrade | bool
        - ansible_facts['distribution'] == 'Debian'

    #####################################################################
    # POST UPGRADE
    #####################################################################

    - name: Esperar locks antes de limpieza final
      ansible.builtin.shell: |
        set -o pipefail

        locks="{{ apt_lock_files | join(' ') }}"
        end=$((SECONDS + {{ apt_lock_timeout_seconds }}))

        while fuser $locks >/dev/null 2>&1; do
          echo "APT/DPKG ocupado antes de limpieza final:"
          fuser -v $locks || true

          if [ "$SECONDS" -ge "$end" ]; then
            echo "Timeout esperando locks antes de limpieza final."
            ps -eo pid,ppid,stat,comm,args | grep -E 'apt|apt-get|dpkg|unattended|do-release-upgrade|noble' | grep -v grep || true
            exit 1
          fi

          sleep {{ apt_lock_check_interval_seconds }}
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Reparar dpkg tras release upgrade si hiciera falta
      ansible.builtin.command: dpkg --configure -a
      register: final_dpkg_configure_result
      changed_when: final_dpkg_configure_result.stdout | length > 0
      failed_when: final_dpkg_configure_result.rc != 0

    - name: Reparar dependencias rotas tras release upgrade si las hubiera
      ansible.builtin.apt:
        state: fixed
        lock_timeout: 600
        force_apt_get: true

    - name: Eliminar paquetes que ya no son necesarios
      ansible.builtin.apt:
        autoremove: true
        purge: true
        lock_timeout: 600
        force_apt_get: true

    - name: Limpiar caché APT
      ansible.builtin.apt:
        autoclean: true
        lock_timeout: 600
        force_apt_get: true

    - name: Comprobar si snap está instalado
      ansible.builtin.stat:
        path: /usr/bin/snap
      register: snap_binary

    - name: Actualizar snaps si snap está instalado
      ansible.builtin.command: snap refresh
      register: snap_refresh
      changed_when: "'All snaps up to date' not in snap_refresh.stdout"
      failed_when: false
      when: snap_binary.stat.exists

    - name: Comprobar si se requiere reinicio final
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: final_reboot_required

    - name: Leer paquetes que solicitan reinicio
      ansible.builtin.slurp:
        path: /var/run/reboot-required.pkgs
      register: reboot_required_pkgs
      when: final_reboot_required.stat.exists

    - name: Mostrar paquetes que requieren reinicio
      ansible.builtin.debug:
        msg: "{{ reboot_required_pkgs.content | b64decode | split('\n') }}"
      when: final_reboot_required.stat.exists

    - name: Reiniciar tras release upgrade si es necesario
      ansible.builtin.reboot:
        msg: "Reinicio final tras release upgrade iniciado por Ansible"
        reboot_timeout: 2400
        post_reboot_delay: 45
        test_command: "whoami"
      when: final_reboot_required.stat.exists

    - name: Refrescar facts finales
      ansible.builtin.setup:

    - name: Comprobar versión final
      ansible.builtin.command: lsb_release -a
      register: final_lsb_release
      changed_when: false
      failed_when: false

    - name: Comprobar paquetes pendientes
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false
      failed_when: false

    - name: Mostrar lsb_release final
      ansible.builtin.debug:
        msg: "{{ final_lsb_release.stdout_lines }}"
      when: final_lsb_release.stdout_lines is defined

    - name: Resumen final
      ansible.builtin.debug:
        msg:
          - "Host actualizado: {{ inventory_hostname }}"
          - "Distribución final: {{ ansible_facts['distribution'] }}"
          - "Versión final: {{ ansible_facts['distribution_version'] }}"
          - "Codename final: {{ ansible_facts['distribution_release'] }}"
          - "Kernel final: {{ ansible_facts['kernel'] }}"
          - "Release upgrade activado: {{ release_upgrade }}"
          - "Paquetes pendientes:"
          - "{{ upgradable_packages.stdout_lines }}"