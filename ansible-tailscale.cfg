[defaults]
timeout = 60
host_key_checking = False
interpreter_python = auto_silent
forks = 5

[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPersist=no -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o TCPKeepAlive=yes -o ConnectionAttempts=10 -o ConnectTimeout=30
retries = 10
pipelining = True
