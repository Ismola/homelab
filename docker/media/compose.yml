x-common-env: &common-env
  PUID: 1000
  PGID: 10
  TZ: Europe/Madrid
  UMASK: 2
  VERSION: docker
  WEBUI_PORT: 8585

services:

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    environment: *common-env
    volumes:
      - ${DOCKER_PATH}/qbittorrent:/config
      - ${MEDIA_PATH}:/media
    devices:
      - /dev/fuse
    ports:
      - 6881:6881
      - 6881:6881/udp
      - 8585:8585
    restart: unless-stopped

  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment: *common-env
    volumes:
      - ${DOCKER_PATH}/jackett/data:/config
      - ${MEDIA_PATH}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped

  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment: *common-env
    volumes:
      - ${DOCKER_PATH}/radarr:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      - qbittorrent
      - jackett

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment: *common-env
    volumes:
      - ${DOCKER_PATH}/sonarr:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      - qbittorrent
      - jackett

  bazarr:
    image: ghcr.io/hotio/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment: *common-env
    volumes:
      - ${DOCKER_PATH}/bazarr:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      - radarr
      - sonarr

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment: *common-env
    volumes:
      - ${DOCKER_PATH}/prowlarr:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      - jackett

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment: *common-env
    devices:
      - /dev/dri:/dev/dri # Acceso a la interfaz de renderizado
      - /dev/mpp_service:/dev/mpp_service # Servicio específico de Rockchip
    volumes:
      - ${DOCKER_PATH}/plex:/config
      - ${MEDIA_PATH}:/media
    ports:
      - "32400:32400"
    restart: unless-stopped

  seerr:
    image: ghcr.io/hotio/seerr:latest
    container_name: seerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment: *common-env
    volumes:
      - ${DOCKER_PATH}/seerr:/config
      - ${MEDIA_PATH}:/media

  qbit_manage:
    image: bobokun/qbit_manage:latest
    container_name: qbit_manage
    environment:
      - PUID=1000
      - QBT_WEB_SERVER=true
      - PGID=10
      - TZ=Europe/Madrid
      - QBT_RUN=false # No ejecutar una sola vez y salir
      - QBT_SCHEDULE=30 # Ejecutar cada 30 minutos
    volumes:
      - ${DOCKER_PATH}/qbit_manage:/config
      - ${MEDIA_PATH}:/media
      - ${MEDIA_PATH}/recycle_bin:/recycle_bin
    restart: unless-stopped

    depends_on:
      - qbittorrent
    ports:
      - "8181:8181"
