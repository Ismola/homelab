name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # RKMPP hardware transcoding for the Rockchip RK3588 in the UGREEN DH4300 Plus.
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined
    group_add:
      - video
    devices:
      - /dev/rga:/dev/rga
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mpp_service:/dev/mpp_service
    volumes:
      - /volume1/Photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - "/volume1/Archivos:/mnt/Archivos"
    environment:
      DB_HOSTNAME: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_IMMICH_USERNAME}
      DB_PASSWORD: ${DB_IMMICH_PASSWORD}
      DB_DATABASE_NAME: ${DB_IMMICH_DATABASE_NAME}
      REDIS_HOSTNAME: redis

    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    platform: linux/arm64
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-rknn
    # RKNN inference on the RK3588 NPU.
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${DOCKER_PATH}/immich/model-cache:/cache
    restart: always
    environment:
      MACHINE_LEARNING_RKNN_THREADS: 2

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_IMMICH_PASSWORD}
      POSTGRES_USER: ${DB_IMMICH_USERNAME}
      POSTGRES_DB: ${DB_IMMICH_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'

    volumes:
      - ${DOCKER_PATH}/immich/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      disable: false
