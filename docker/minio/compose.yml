services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the h0 stack environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the h0 stack environment}
    volumes:
      - ${DOCKER_PATH:?set DOCKER_PATH in the h0 stack environment}/minio/data:/data
    ports:
      - "100.111.128.66:9010:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the h0 stack environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the h0 stack environment}
      MINIO_LONGHORN_ACCESS_KEY: ${MINIO_LONGHORN_ACCESS_KEY:?set MINIO_LONGHORN_ACCESS_KEY in the h0 stack environment}
      MINIO_LONGHORN_SECRET_KEY: ${MINIO_LONGHORN_SECRET_KEY:?set MINIO_LONGHORN_SECRET_KEY in the h0 stack environment}
    volumes:
      - ./policies:/policies:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/longhorn
        mc admin policy create local longhorn-backup /policies/longhorn-backup.json
        mc admin user add local "$${MINIO_LONGHORN_ACCESS_KEY}" "$${MINIO_LONGHORN_SECRET_KEY}"
        mc admin policy attach local longhorn-backup --user "$${MINIO_LONGHORN_ACCESS_KEY}"
    restart: "no"
    security_opt:
      - no-new-privileges:true
