services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the h0 stack environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the h0 stack environment}
    volumes:
      - ${DOCKER_PATH:?set DOCKER_PATH in the h0 stack environment}/minio/data:/data
    ports:
      - "100.111.128.66:9010:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio-k3s-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-k3s-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the h0 stack environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the h0 stack environment}
      MINIO_K3S_ACCESS_KEY: ${MINIO_K3S_ACCESS_KEY:?set MINIO_K3S_ACCESS_KEY in the h0 stack environment}
      MINIO_K3S_SECRET_KEY: ${MINIO_K3S_SECRET_KEY:?set MINIO_K3S_SECRET_KEY in the h0 stack environment}
      MINIO_K3S_BUCKET: ${MINIO_K3S_BUCKET:-k3s-etcd}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$${MINIO_K3S_BUCKET}"
        printf '%s\n' \
          '{' \
          '  "Version": "2012-10-17",' \
          '  "Statement": [' \
          '    {' \
          '      "Effect": "Allow",' \
          '      "Action": ["s3:GetBucketLocation", "s3:ListBucket"],' \
          '      "Resource": ["arn:aws:s3:::'"$${MINIO_K3S_BUCKET}"'"]' \
          '    },' \
          '    {' \
          '      "Effect": "Allow",' \
          '      "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],' \
          '      "Resource": ["arn:aws:s3:::'"$${MINIO_K3S_BUCKET}"'/*"]' \
          '    }' \
          '  ]' \
          '}' > /tmp/k3s-etcd-policy.json
        mc admin user add local "$${MINIO_K3S_ACCESS_KEY}" "$${MINIO_K3S_SECRET_KEY}"
        mc admin policy create local k3s-etcd-snapshots /tmp/k3s-etcd-policy.json
        mc admin policy attach local k3s-etcd-snapshots --user "$${MINIO_K3S_ACCESS_KEY}"
    restart: "no"
    security_opt:
      - no-new-privileges:true
