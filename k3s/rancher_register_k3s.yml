
# ES MEJOR IR DE 1 en 1
# ansible-playbook k3s/rancher_register_k3s.yml \
#   --limit k3s_workers_stg \
#   -e rancher_role_worker=true \
#   -e rancher_role_controlplane=false \
#   -e rancher_role_etcd=false


---
- name: Registrar nodo K3s en Rancher mediante system-agent con Tailscale
  hosts: all
  become: true
  gather_facts: true
  serial: 1

  vars:
    rancher_url: "{{ lookup('ansible.builtin.env', 'RANCHER_URL') | default('https://vm5.elver-chicken.ts.net', true) }}"
    rancher_token: "{{ lookup('ansible.builtin.env', 'RANCHER_TOKEN') }}"
    rancher_ca_checksum: "{{ lookup('ansible.builtin.env', 'RANCHER_CA_CHECKSUM') }}"
    rancher_node_label: "{{ lookup('ansible.builtin.env', 'RANCHER_NODE_LABEL') | default('cattle.io/os=linux', true) }}"

    rancher_role_etcd: true
    rancher_role_controlplane: true
    rancher_role_worker: true

    rancher_curl_insecure: "{{ lookup('ansible.builtin.env', 'RANCHER_CURL_INSECURE') | default('true', true) | bool }}"
    rancher_no_log: "{{ lookup('ansible.builtin.env', 'RANCHER_NO_LOG') | default('true', true) | bool }}"
    force_register: false

    tailscale_iface: "{{ lookup('ansible.builtin.env', 'TAILSCALE_IFACE') | default('tailscale0', true) }}"
    force_tailscale_node_ip: "{{ lookup('ansible.builtin.env', 'FORCE_TAILSCALE_NODE_IP') | default('true', true) | bool }}"
    fix_coredns_for_rancher_hostname: "{{ lookup('ansible.builtin.env', 'FIX_COREDNS_FOR_RANCHER_HOSTNAME') | default('true', true) | bool }}"

  tasks:
    - name: Validar variables obligatorias
      ansible.builtin.assert:
        that:
          - rancher_url is defined
          - rancher_url | length > 0
          - rancher_token is defined
          - rancher_token | length > 0
          - rancher_ca_checksum is defined
          - rancher_ca_checksum | length > 0
        fail_msg: "Faltan variables obligatorias: rancher_url, rancher_token o rancher_ca_checksum. Carga el .env con: set -a && source .env && set +a"

    - name: Extraer hostname de Rancher desde rancher_url
      ansible.builtin.set_fact:
        rancher_hostname: "{{ rancher_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}"

    - name: Instalar dependencias necesarias
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - python3
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Comprobar Tailscale local
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip_cmd
      changed_when: false
      failed_when: tailscale_ip_cmd.stdout | trim == ""

    - name: Guardar IP Tailscale local del nodo
      ansible.builtin.set_fact:
        node_tailscale_ip: "{{ tailscale_ip_cmd.stdout_lines[0] | trim }}"

    - name: Resolver hostname de Rancher desde el nodo
      ansible.builtin.shell: |
        set -e
        getent ahostsv4 "{{ rancher_hostname }}" | awk '{print $1; exit}'
      args:
        executable: /bin/bash
      register: rancher_resolve_cmd
      changed_when: false
      failed_when: rancher_resolve_cmd.stdout | trim == ""

    - name: Guardar IP resuelta de Rancher
      ansible.builtin.set_fact:
        rancher_resolved_ip: "{{ rancher_resolve_cmd.stdout | trim }}"

    - name: Mostrar datos Tailscale detectados
      ansible.builtin.debug:
        msg:
          - "Nodo: {{ inventory_hostname }}"
          - "IP Tailscale nodo: {{ node_tailscale_ip }}"
          - "Rancher hostname: {{ rancher_hostname }}"
          - "Rancher IP resuelta: {{ rancher_resolved_ip }}"

    - name: Asegurar resolución local de Rancher en /etc/hosts del nodo
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\S+\s+{{ rancher_hostname | regex_escape }}$'
        line: "{{ rancher_resolved_ip }} {{ rancher_hostname }}"
        state: present
        backup: true

    - name: Comprobar si rancher-system-agent ya existe
      ansible.builtin.stat:
        path: /etc/systemd/system/rancher-system-agent.service
      register: rancher_agent_service

    - name: Construir argumentos de roles
      ansible.builtin.set_fact:
        rancher_role_args: >-
          {{ '--etcd' if rancher_role_etcd | bool else '' }}
          {{ '--controlplane' if rancher_role_controlplane | bool else '' }}
          {{ '--worker' if rancher_role_worker | bool else '' }}

    - name: Construir argumentos de red Tailscale para Rancher
      ansible.builtin.set_fact:
        rancher_network_args: >-
          {{ '--address ' ~ node_tailscale_ip ~ ' --internal-address ' ~ node_tailscale_ip if force_tailscale_node_ip | bool else '' }}

    - name: Registrar nodo en Rancher
      ansible.builtin.shell: |
        set -euo pipefail

        CURL_ARGS="-fL"
        if [ "{{ rancher_curl_insecure | bool }}" = "True" ]; then
          CURL_ARGS="-kfL"
        fi

        curl ${CURL_ARGS} "{{ rancher_url }}/system-agent-install.sh" | sh -s - \
          --server "{{ rancher_url }}" \
          --label "{{ rancher_node_label }}" \
          --token "{{ rancher_token }}" \
          --ca-checksum "{{ rancher_ca_checksum }}" \
          {{ rancher_role_args }} \
          {{ rancher_network_args }}
      args:
        executable: /bin/bash
      async: 900
      poll: 0
      no_log: "{{ rancher_no_log | bool }}"
      when: force_register | bool or not rancher_agent_service.stat.exists
      register: rancher_register_job

    - name: Esperar a que termine el instalador de Rancher
      ansible.builtin.async_status:
        jid: "{{ rancher_register_job.ansible_job_id }}"
      register: rancher_register_result
      until: rancher_register_result.finished
      retries: 90
      delay: 10
      no_log: "{{ rancher_no_log | bool }}"
      when:
        - rancher_register_job is defined
        - rancher_register_job.ansible_job_id is defined

    - name: Recargar systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Comprobar si se creó rancher-system-agent
      ansible.builtin.stat:
        path: /etc/systemd/system/rancher-system-agent.service
      register: rancher_agent_service_after

    - name: Fallar si rancher-system-agent no se creó
      ansible.builtin.fail:
        msg: "El instalador terminó, pero no se creó /etc/systemd/system/rancher-system-agent.service. Ejecuta con -e rancher_no_log=false para ver el error real."
      when: not rancher_agent_service_after.stat.exists

    - name: Habilitar y arrancar rancher-system-agent
      ansible.builtin.systemd:
        name: rancher-system-agent
        enabled: true
        state: started
        daemon_reload: true

    - name: Mostrar estado del agente
      ansible.builtin.command:
        cmd: systemctl is-active rancher-system-agent
      register: rancher_agent_status
      changed_when: false
      failed_when: rancher_agent_status.stdout != "active"

    - name: Esperar a que exista k3s.service en nodo control-plane
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_service_stat
      retries: 90
      delay: 10
      until: k3s_service_stat.stat.exists
      when: rancher_role_controlplane | bool or rancher_role_etcd | bool

    - name: Esperar a que K3s esté activo en nodo control-plane
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_active
      changed_when: false
      retries: 90
      delay: 10
      until: k3s_active.stdout == "active"
      when: rancher_role_controlplane | bool or rancher_role_etcd | bool

    - name: Esperar API local K3s en nodo control-plane
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_api
      changed_when: false
      retries: 90
      delay: 10
      until: k3s_api.rc == 0
      when: rancher_role_controlplane | bool or rancher_role_etcd | bool

    - name: Esperar CoreDNS en nodo control-plane
      ansible.builtin.command: k3s kubectl -n kube-system get configmap coredns
      register: coredns_cm_exists
      changed_when: false
      retries: 90
      delay: 10
      until: coredns_cm_exists.rc == 0
      when:
        - fix_coredns_for_rancher_hostname | bool
        - rancher_role_controlplane | bool or rancher_role_etcd | bool

    - name: Parchear CoreDNS para resolver Rancher por Tailscale
      ansible.builtin.shell: |
        set -euo pipefail

        k3s kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' > /tmp/Corefile

        python3 <<'PY'
        import os
        from pathlib import Path

        path = Path('/tmp/Corefile')
        corefile = path.read_text()

        host = os.environ['RANCHER_HOST'].strip()
        ip = os.environ['RANCHER_IP'].strip()

        exact_entry = '        ' + ip + ' ' + host

        if exact_entry in corefile:
            print('COREDNS_CHANGED=false')
            print(host + ' ya existe en CoreDNS con IP ' + ip)
            raise SystemExit(0)

        cleaned_lines = []
        for line in corefile.splitlines():
            if host in line and not line.strip().startswith('#'):
                continue
            cleaned_lines.append(line)

        corefile = '\n'.join(cleaned_lines) + '\n'

        open_brace = chr(123)
        close_brace = chr(125)
        marker = '    hosts /etc/coredns/NodeHosts ' + open_brace + '\n'
        entry = exact_entry + '\n'

        if marker in corefile:
            corefile = corefile.replace(marker, marker + entry, 1)
        else:
            forward_marker = '    forward . /etc/resolv.conf\n'
            block = (
                '    hosts ' + open_brace + '\n'
                + exact_entry + '\n'
                + '        fallthrough\n'
                + '    ' + close_brace + '\n'
            )

            if forward_marker not in corefile:
                raise SystemExit('No se encontró bloque hosts ni forward en Corefile')

            corefile = corefile.replace(forward_marker, block + forward_marker, 1)

        path.write_text(corefile)
        print('COREDNS_CHANGED=true')
        print('Añadido ' + host + ' -> ' + ip)
        PY

        k3s kubectl -n kube-system create configmap coredns \
          --from-file=Corefile=/tmp/Corefile \
          --dry-run=client \
          -o yaml | k3s kubectl apply -f -

        k3s kubectl -n kube-system rollout restart deployment/coredns
        k3s kubectl -n kube-system rollout status deployment/coredns --timeout=5m
      args:
        executable: /bin/bash
      environment:
        RANCHER_HOST: "{{ rancher_hostname }}"
        RANCHER_IP: "{{ rancher_resolved_ip }}"
      register: coredns_patch
      changed_when: "'COREDNS_CHANGED=true' in coredns_patch.stdout"
      when:
        - fix_coredns_for_rancher_hostname | bool
        - rancher_role_controlplane | bool or rancher_role_etcd | bool

    - name: Reiniciar cattle-cluster-agent tras corregir DNS
      ansible.builtin.command: >
        k3s kubectl -n cattle-system delete pod
        -l app=cattle-cluster-agent
        --ignore-not-found=true
      changed_when: true
      failed_when: false
      when:
        - fix_coredns_for_rancher_hostname | bool
        - rancher_role_controlplane | bool or rancher_role_etcd | bool

    - name: Comprobar resolución DNS de Rancher desde un pod
      ansible.builtin.shell: |
        set -euo pipefail

        k3s kubectl -n default delete pod rancher-dns-test --ignore-not-found=true --wait=false >/dev/null 2>&1 || true

        k3s kubectl -n default run rancher-dns-test \
          --rm -i \
          --restart=Never \
          --image=curlimages/curl:8.10.1 \
          -- sh -c 'nslookup {{ rancher_hostname }} && curl -kfsS --connect-timeout 10 {{ rancher_url }}/ping'
      args:
        executable: /bin/bash
      register: rancher_dns_test
      changed_when: false
      retries: 6
      delay: 20
      until: rancher_dns_test.rc == 0
      when:
        - fix_coredns_for_rancher_hostname | bool
        - rancher_role_controlplane | bool or rancher_role_etcd | bool

    - name: Resultado
      ansible.builtin.debug:
        msg:
          - "rancher-system-agent está en estado: {{ rancher_agent_status.stdout }}"
          - "IP Tailscale del nodo: {{ node_tailscale_ip }}"
          - "Rancher: {{ rancher_hostname }} -> {{ rancher_resolved_ip }}"