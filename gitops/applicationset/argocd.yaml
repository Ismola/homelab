# Esto esta aplicado en Headlmap


apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/Ismola/homelab.git
        revision: main
        directories:
          - path: gitops/apps/*
          - path: gitops/apps/sample
            exclude: true

  template:
    metadata:
      name: '{{.path.basenameNormalized}}'
    spec:
      project: default

      source:
        repoURL: https://github.com/Ismola/homelab.git
        targetRevision: main
        path: '{{.path.path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basenameNormalized}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

  # Los CRDs de kube-prometheus-stack superan el límite de 256 KiB de la
  # anotación usada por client-side apply. Para monitoring evitamos esa fase
  # de migración y dejamos que Argo CD los gestione directamente con SSA.
  templatePatch: |
    {{- if eq .path.basenameNormalized "monitoring" }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - DisableClientSideApplyMigration=true
          - SkipDryRunOnMissingResource=true
    {{- end }}
