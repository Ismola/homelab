apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: js-snake
  namespace: js-snake
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "js-snake.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: js-snake
          port: 80
