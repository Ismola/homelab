longhorn:
  global:
    nodeSelector:
      capability.isma.dev/storage: "true"

  # No sustituye local-path como StorageClass por defecto. Los StatefulSet
  # deben seleccionar "longhorn" explícitamente.
  persistence:
    defaultClass: false
    defaultClassReplicaCount: 2
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    dataEngine: v1

  # Longhorn sólo crea discos y ejecuta componentes (manager, CSI, engine
  # images e instance managers) en v3/v7. Los nodos de 1 GiB quedan libres
  # para node-exporter, cloudflared y frontends pequeños.
  defaultSettings:
    createDefaultDiskLabeledNodes: true
    defaultDataPath: /var/lib/longhorn
    defaultReplicaCount: '{"v1":"2"}'
    replicaSoftAntiAffinity: false
    replicaDiskSoftAntiAffinity: false
    systemManagedComponentsNodeSelector: "capability.isma.dev/storage:true"
    storageOverProvisioningPercentage: 100
    # v3 conserva margen para el sistema, pero puede alojar las segundas
    # réplicas de los volúmenes de 1 GiB.
    storageMinimalAvailablePercentage: 15
    storageReservedPercentageForDefaultDisk: 20
    disableSchedulingOnCordonedNode: true
    upgradeChecker: false
    allowCollectingLonghornUsageMetrics: false
    v1DataEngine: true
    v2DataEngine: false

  # MinIO está fuera del clúster y se alcanza directamente por Tailscale.
  # El endpoint S3 y las credenciales se guardan en el Secret, no en Git.
  defaultBackupStore:
    backupTarget: "s3://k3s-etcd@us-east-1/homelab/longhorn/"
    backupTargetCredentialSecret: longhorn-minio-credentials
    pollInterval: 300

  # El job de pre-upgrade usa hooks de Helm que no encajan con la
  # reconciliación declarativa de Argo CD.
  preUpgradeChecker:
    jobEnabled: false
    upgradeVersionCheck: false

  longhornUI:
    replicas: 2
    nodeSelector:
      capability.isma.dev/stable: "true"

  longhornDriver:
    nodeSelector:
      capability.isma.dev/stable: "true"

  service:
    ui:
      type: ClusterIP

  ingress:
    enabled: false
