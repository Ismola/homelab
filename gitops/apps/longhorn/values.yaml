longhorn:
  global:
    nodeSelector:
      tags.isma.dev/longhorn: "true"

  # No sustituye local-path como StorageClass por defecto. Los StatefulSet
  # deben seleccionar "longhorn" explícitamente.
  persistence:
    defaultClass: false
    defaultClassReplicaCount: 2
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    dataEngine: v1

  # Longhorn sólo crea discos y ejecuta sus componentes en v3/v7, los nodos
  # marcados desde el inventario de Ansible.
  defaultSettings:
    backupTarget: "cifs://100.111.128.66/Archivos/opencloud/storage/users/users/934c2b07-76cc-49eb-8738-fc4ed171f4f3/4%20Archives/Backup/Longhorn?cifsOptions=vers=3.0,soft"
    backupTargetCredentialSecret: longhorn-smb-credentials
    createDefaultDiskLabeledNodes: true
    defaultDataPath: /var/lib/longhorn
    defaultReplicaCount: '{"v1":"2"}'
    replicaSoftAntiAffinity: false
    replicaDiskSoftAntiAffinity: false
    systemManagedComponentsNodeSelector: "tags.isma.dev/longhorn:true"
    storageOverProvisioningPercentage: 100
    storageMinimalAvailablePercentage: 25
    storageReservedPercentageForDefaultDisk: 20
    disableSchedulingOnCordonedNode: true
    upgradeChecker: false
    allowCollectingLonghornUsageMetrics: false
    v1DataEngine: true
    v2DataEngine: false

  # El job de pre-upgrade usa hooks de Helm que no encajan con la
  # reconciliación declarativa de Argo CD.
  preUpgradeChecker:
    jobEnabled: false
    upgradeVersionCheck: false

  longhornUI:
    replicas: 2
    nodeSelector:
      tags.isma.dev/stable: "true"

  longhornDriver:
    nodeSelector:
      tags.isma.dev/stable: "true"

  service:
    ui:
      type: ClusterIP

  ingress:
    enabled: false
