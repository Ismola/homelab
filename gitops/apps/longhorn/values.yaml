longhorn:
  # No sustituye local-path como StorageClass por defecto. Los StatefulSet
  # deben seleccionar "longhorn" explícitamente.
  persistence:
    defaultClass: false
    defaultClassReplicaCount: 2
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    dataEngine: v1

  # Longhorn sólo crea discos en v3/v7, los nodos marcados desde el inventario
  # de Ansible. Manager, CSI e instance-manager pueden ejecutarse en cualquier
  # nodo para que los workloads monten volúmenes desde todo el clúster.
  defaultSettings:
    createDefaultDiskLabeledNodes: true
    defaultDataPath: /var/lib/longhorn
    defaultReplicaCount: '{"v1":"2"}'
    replicaSoftAntiAffinity: false
    replicaDiskSoftAntiAffinity: false
    systemManagedComponentsNodeSelector: ""
    storageOverProvisioningPercentage: 100
    storageMinimalAvailablePercentage: 25
    storageReservedPercentageForDefaultDisk: 20
    disableSchedulingOnCordonedNode: true
    upgradeChecker: false
    allowCollectingLonghornUsageMetrics: false
    v1DataEngine: true
    v2DataEngine: false

  # El job de pre-upgrade usa hooks de Helm que no encajan con la
  # reconciliación declarativa de Argo CD.
  preUpgradeChecker:
    jobEnabled: false
    upgradeVersionCheck: false

  longhornUI:
    replicas: 2
    nodeSelector:
      tags.isma.dev/stable: "true"

  longhornDriver:
    nodeSelector:
      tags.isma.dev/stable: "true"

  service:
    ui:
      type: ClusterIP

  ingress:
    enabled: false
