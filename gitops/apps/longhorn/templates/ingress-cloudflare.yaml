apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-cloudflare
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: traefik

  rules:
    - host: longhorn.ismola.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
