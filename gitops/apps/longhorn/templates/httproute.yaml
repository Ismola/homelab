apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "longhorn.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
