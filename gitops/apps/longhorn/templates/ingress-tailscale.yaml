apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-tailnet
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-class: stable-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: longhorn-frontend
      port:
        number: 80
  tls:
    - hosts:
        - longhorn
