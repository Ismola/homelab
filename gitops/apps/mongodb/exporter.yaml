apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  labels:
    app.kubernetes.io/name: mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-exporter
    spec:
      nodeSelector:
        capability.isma.dev/stable: "true"
      containers:
        - name: exporter
          image: percona/mongodb_exporter:0.51.0
          args:
            - --mongodb.uri=mongodb://$(MONGODB_USER):$(MONGODB_PASSWORD)@mongodb:27017/admin?authSource=admin
            - --collect-all
            - --compatible-mode
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: password
          ports:
            - name: metrics
              containerPort: 9216
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  labels:
    app.kubernetes.io/name: mongodb-exporter
spec:
  selector:
    app.kubernetes.io/name: mongodb-exporter
  ports:
    - name: metrics
      port: 9216
      targetPort: metrics
