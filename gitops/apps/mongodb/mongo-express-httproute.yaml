apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mongo-express-cloudflare
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "mongo-express.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mongo-express
          port: 80
