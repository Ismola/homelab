apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-critical
value: 900000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Critical cluster networking and control-plane add-ons. Longhorn keeps its
  chart-provided longhorn-critical class at a higher priority.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-platform
value: 100000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Important platform and administration workloads that should take precedence
  over regular applications.
