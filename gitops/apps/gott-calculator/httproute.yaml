apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gott-calculator
  namespace: gott-calculator
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "gott-calculator.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gott-calculator
          port: 80
