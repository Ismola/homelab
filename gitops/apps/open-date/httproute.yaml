apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-date
  namespace: open-date
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "open-date.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-date
          port: 80
