apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bible-jwpub
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: gateway-system
  hostnames:
    - bibles-jwpub.ismola.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bible-jwpub
          port: 80
