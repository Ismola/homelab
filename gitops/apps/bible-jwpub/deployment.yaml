apiVersion: apps/v1
kind: Deployment
metadata:
  name: bible-jwpub
  labels:
    app: bible-jwpub
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bible-jwpub
  template:
    metadata:
      labels:
        app: bible-jwpub
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      nodeSelector:
        capability.isma.dev/stable: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/ismola/bible-jwpub:main
        workingDir: /app
        command:
        - python
        - -m
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: DATA_DIR
          value: /data
        - name: AUTO_IMPORT
          value: 'true'
        - name: MAX_UPLOAD_MB
          value: '30'
        - name: UPLOAD_TTL_HOURS
          value: '24'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          failureThreshold: 40
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 4
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        imagePullPolicy: Always
      - name: worker
        image: ghcr.io/ismola/bible-jwpub:main
        workingDir: /app
        command:
        - python
        - -m
        - app.worker
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: DATA_DIR
          value: /data
        - name: WORKER_CONCURRENCY
          value: '2'
        - name: AUTO_IMPORT
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/data/worker-heartbeat').st_mtime<180
          initialDelaySeconds: 90
          periodSeconds: 60
          failureThreshold: 3
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: '1'
            memory: 1536Mi
            ephemeral-storage: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        imagePullPolicy: Always
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bible-jwpub-data
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
