apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zip-hider
  namespace: zip-hider
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "zip-hider.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zip-hider
          port: 80
