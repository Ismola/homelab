apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-cloudflare
  namespace: argocd
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "argocd.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
