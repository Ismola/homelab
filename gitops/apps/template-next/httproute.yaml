apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: template-next
  namespace: template-next
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: gateway-system
  hostnames:
    - "template-next.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: template-next
          port: 80
          weight: 1
