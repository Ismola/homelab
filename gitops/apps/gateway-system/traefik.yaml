apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-gateway-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 34.5.0
    helm:
      releaseName: traefik-gateway
      valuesObject:
        deployment:
          replicas: 2
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: capability.isma.dev/stable
                      operator: In
                      values: ["true"]
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
                      app.kubernetes.io/instance: traefik-gateway-gateway-system
                  topologyKey: kubernetes.io/hostname
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true
        gateway:
          enabled: false
        gatewayClass:
          enabled: false
        ingressClass:
          enabled: false
        priorityClassName: homelab-critical
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
