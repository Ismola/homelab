apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-image-updater-controller
          resources:
            limits:
              memory: 1Gi
      priorityClassName: homelab-critical
      nodeSelector:
        capability.isma.dev/stable: "true"
      dnsConfig:
        options:
          # Consulta github.com y ghcr.io antes de los sufijos DNS del nodo.
          # El sufijo de Oracle VCN devuelve SERVFAIL para nombres externos.
          - name: ndots
            value: "1"
