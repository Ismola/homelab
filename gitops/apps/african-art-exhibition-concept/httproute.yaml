apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: african-art-exhibition-concept
  namespace: african-art-exhibition-concept
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: gateway-system
  hostnames:
    - "african-art-exhibition-concept.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: african-art-exhibition-concept
          port: 80
          weight: 1
