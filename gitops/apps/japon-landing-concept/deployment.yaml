apiVersion: apps/v1
kind: Deployment
metadata:
  name: japon-landing-concept
  namespace: japon-landing-concept
  labels:
    app: japon-landing-concept
spec:
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: japon-landing-concept
  template:
    metadata:
      labels:
        app: japon-landing-concept
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: isma.dev/ram-gb
                    operator: In
                    values: ["1"]
      containers:
        - name: japon-landing-concept
          image: ghcr.io/ismola/japon-landing-concept:main
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 256Mi
