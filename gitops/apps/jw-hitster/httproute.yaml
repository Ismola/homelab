apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jw-hitster
  namespace: jw-hitster
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "jw-hitster.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jw-hitster
          port: 80
