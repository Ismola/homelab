kube-prometheus-stack:
  crds:
    enabled: true

  # Los dashboards se gestionan con el Git Sync nativo de Grafana. Desactivar
  # los dashboards del chart evita que dos provisioners reclamen los mismos UID.
  defaultDashboardsEnabled: false

  # Algunos componentes internos de K3s no exponen sus métricas
  # como lo haría un clúster Kubernetes tradicional.
  kubeEtcd:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false

  grafana:
    enabled: true

    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    testFramework:
      enabled: false

    nodeSelector:
      capability.isma.dev/stable: "true"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    grafana.ini:
      server:
        root_url: https://grafana.ismola.dev
      users:
        allow_sign_up: false

      auth.anonymous:
        enabled: false

      security:
        cookie_secure: true
        cookie_samesite: lax

      smtp:
        enabled: true
        host: "smtp.gmail.com:587"
        user: "ismolahiena@gmail.com"
        password: "$__env{GF_SMTP_PASSWORD}"
        from_address: "ismolahiena@gmail.com"
        from_name: "Grafana K3s"
        skip_verify: false
        startTLS_policy: "MandatoryStartTLS"

    envValueFrom:
      GF_SMTP_PASSWORD:
        secretKeyRef:
          name: grafana-smtp
          key: password

    # Git Sync sólo soporta dashboards y carpetas. El resto de la configuración
    # de alerting se provisiona desde este mismo chart/repo.
    alerting:
      contact-points.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: Correo administrador K3s
            receivers:
              - uid: dftk50sv51xc0e
                type: email
                settings:
                  addresses: ismolahiena@gmail.com
                  singleEmail: false
                disableResolveMessage: true
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: Correo administrador K3s
            group_by:
              - grafana_folder
              - alertname
            group_wait: 2m
            group_interval: 15m
            repeat_interval: 12h

    # Mantener temporalmente un provider vacío con el nombre anterior hace que
    # Grafana retire de forma limpia los dashboards provisionados por ConfigMap.
    # Los dashboards de Git Sync usan otro manager y no se ven afectados.
    dashboardProviders:
      migration.yaml:
        apiVersion: 1
        providers:
          - name: sidecarProvider
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: false
            options:
              path: /var/lib/grafana/dashboards/migration-empty

    extraEmptyDirMounts:
      - name: migration-empty-dashboards
        mountPath: /var/lib/grafana/dashboards/migration-empty

    extraContainerVolumes:
      - name: grafana-git-sync-config
        configMap:
          name: '{{ .Release.Name }}-grafana-git-sync'

    # Grafana guarda la conexión Git Sync en su base de datos. Este reconciler
    # la crea/restaura desde repository.json y realiza la migración inicial de
    # los recursos que antes habían sido creados desde la UI/ConfigMaps.
    extraContainers: |
      - name: git-sync-provisioner
        image: docker.io/curlimages/curl:8.21.0
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - /etc/grafana/git-sync/reconcile.sh
        env:
          - name: GF_SECURITY_ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-user
          - name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-password
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: grafana-git-sync-config
            mountPath: /etc/grafana/git-sync
            readOnly: true

    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      dashboards:
        enabled: false

  prometheus:
    enabled: true

    prometheusSpec:
      replicas: 1

      retention: 7d
      retentionSize: 8GB

      scrapeInterval: 30s
      evaluationInterval: 30s

      walCompression: true

      nodeSelector:
        capability.isma.dev/stable: "true"

      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: "1"
          memory: 2Gi

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    enabled: true

    alertmanagerSpec:
      replicas: 1

      nodeSelector:
        capability.isma.dev/stable: "true"

      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi

      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

  prometheusOperator:
    nodeSelector:
      capability.isma.dev/stable: "true"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  kube-state-metrics:
    nodeSelector:
      capability.isma.dev/stable: "true"

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Este DaemonSet se ejecutará en todos los nodos para recoger
  # sus métricas de CPU, RAM, disco y red.
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi
