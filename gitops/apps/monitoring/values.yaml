# Cloudflare Free no garantiza todas las métricas de Analytics por API. El
# exporter mantiene el dashboard operativo y expone cloudflare_analytics_up=0
# cuando el token, la zona o el dataset no están disponibles.
cloudflareAnalytics:
  enabled: true
  secretName: cloudflare-analytics
  refreshIntervalSeconds: 900
  image: python:3.13-alpine
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

kube-prometheus-stack:
  crds:
    enabled: true

  # Los dashboards se gestionan con el Git Sync nativo de Grafana. Desactivar
  # los dashboards del chart evita que dos provisioners reclamen los mismos UID.
  defaultDashboardsEnabled: false

  # Algunos componentes internos de K3s no exponen sus métricas
  # como lo haría un clúster Kubernetes tradicional.
  kubeEtcd:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false

  grafana:
    enabled: true

    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    testFramework:
      enabled: false

    nodeSelector:
      capability.isma.dev/stable: "true"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    grafana.ini:
      server:
        root_url: https://grafana.ismola.dev
      users:
        allow_sign_up: false

      auth.anonymous:
        enabled: false

      security:
        cookie_secure: true
        cookie_samesite: lax

      smtp:
        enabled: true
        host: "smtp.gmail.com:587"
        user: "ismolahiena@gmail.com"
        password: "$__env{GF_SMTP_PASSWORD}"
        from_address: "ismolahiena@gmail.com"
        from_name: "Grafana K3s"
        skip_verify: false
        startTLS_policy: "MandatoryStartTLS"

    envValueFrom:
      GF_SMTP_PASSWORD:
        secretKeyRef:
          name: grafana-smtp
          key: password

    # Git Sync sólo soporta dashboards y carpetas. El resto de la configuración
    # de alerting se provisiona desde este mismo chart/repo.
    alerting:
      contact-points.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: Correo administrador K3s
            receivers:
              - uid: dftk50sv51xc0e
                type: email
                settings:
                  addresses: ismolahiena@gmail.com
                  singleEmail: false
                disableResolveMessage: true
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: Correo administrador K3s
            group_by:
              - grafana_folder
              - alertname
            group_wait: 2m
            group_interval: 15m
            repeat_interval: 12h
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: calendar-subscription-hub
            folder: Homelab Alerts
            interval: 1m
            rules:
              - uid: calendar-sync-errors
                title: Calendar Subscription Hub sync error
                condition: C
                data:
                  - refId: A
                    datasourceUid: prometheus
                    relativeTimeRange:
                      from: 600
                      to: 0
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: sum by (provider) (calendar_subscription_hub_subscriptions{sync_status="ERROR"})
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      conditions: []
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      reducer: last
                      refId: B
                      type: reduce
                  - refId: C
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - C
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      refId: C
                      type: threshold
                noDataState: OK
                execErrState: Error
                for: 2m
                annotations:
                  summary: Calendar Subscription Hub has a subscription in sync error state
                  description: At least one subscription has remained in ERROR state for two minutes.
                labels:
                  severity: warning
                  service: calendar-subscription-hub
                isPaused: false
              - uid: asismetro-high-memory
                title: Asismetro Automations high memory usage
                condition: C
                data:
                  - refId: A
                    datasourceUid: prometheus
                    relativeTimeRange:
                      from: 600
                      to: 0
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: 100 * max by (pod) (container_memory_working_set_bytes{namespace="calendar-subscription-hub",container="asismetro-automations"}) / max by (pod) (kube_pod_container_resource_limits{namespace="calendar-subscription-hub",container="asismetro-automations",resource="memory"})
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      conditions: []
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      reducer: last
                      refId: B
                      type: reduce
                  - refId: C
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 85
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - C
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      refId: C
                      type: threshold
                noDataState: OK
                execErrState: Error
                for: 5m
                annotations:
                  summary: Asismetro Automations is close to its memory limit
                  description: An Asismetro Automations pod has used more than 85% of its memory limit for five minutes.
                labels:
                  severity: warning
                  service: asismetro-automations
                isPaused: false
          - orgId: 1
            name: cloudflare-public-pages
            folder: Homelab Alerts
            interval: 1m
            rules:
              - uid: cloudflare-page-unavailable
                title: Public page unavailable through Cloudflare
                condition: C
                data:
                  - refId: A
                    datasourceUid: prometheus
                    relativeTimeRange:
                      from: 600
                      to: 0
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus
                      editorMode: code
                      expr: probe_success{job="cloudflare-public-pages"}
                      instant: true
                      intervalMs: 1000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      conditions: []
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      reducer: last
                      refId: B
                      type: reduce
                  - refId: C
                    datasourceUid: __expr__
                    relativeTimeRange:
                      from: 0
                      to: 0
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 1
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - C
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      refId: C
                      type: threshold
                noDataState: Alerting
                execErrState: Error
                for: 3m
                annotations:
                  summary: A public page is unavailable through Cloudflare
                  description: An external HTTPS probe has failed for three minutes.
                labels:
                  severity: critical
                  service: cloudflare-tunnel
                isPaused: false

    # Mantener temporalmente un provider vacío con el nombre anterior hace que
    # Grafana retire de forma limpia los dashboards provisionados por ConfigMap.
    # Los dashboards de Git Sync usan otro manager y no se ven afectados.
    dashboardProviders:
      migration.yaml:
        apiVersion: 1
        providers:
          - name: sidecarProvider
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: false
            options:
              path: /var/lib/grafana/dashboards/migration-empty

    extraEmptyDirMounts:
      - name: migration-empty-dashboards
        mountPath: /var/lib/grafana/dashboards/migration-empty

    extraContainerVolumes:
      - name: grafana-git-sync-config
        configMap:
          name: '{{ .Release.Name }}-grafana-git-sync'

    # Grafana guarda la conexión Git Sync en su base de datos. Este reconciler
    # la crea/restaura desde repository.json y realiza la migración inicial de
    # los recursos que antes habían sido creados desde la UI/ConfigMaps.
    extraContainers: |
      - name: git-sync-provisioner
        image: docker.io/curlimages/curl:8.21.0
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - /etc/grafana/git-sync/reconcile.sh
        env:
          - name: GF_SECURITY_ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-user
          - name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: admin-password
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: grafana-git-sync-config
            mountPath: /etc/grafana/git-sync
            readOnly: true

    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      dashboards:
        enabled: false

  prometheus:
    enabled: true

    prometheusSpec:
      replicas: 1

      retention: 7d
      retentionSize: 8GB

      scrapeInterval: 30s
      evaluationInterval: 30s

      walCompression: true

      nodeSelector:
        capability.isma.dev/stable: "true"

      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: "1"
          memory: 2Gi

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    enabled: true

    alertmanagerSpec:
      replicas: 1

      nodeSelector:
        capability.isma.dev/stable: "true"

      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi

      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

  prometheusOperator:
    nodeSelector:
      capability.isma.dev/stable: "true"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  kube-state-metrics:
    nodeSelector:
      capability.isma.dev/stable: "true"

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Este DaemonSet se ejecutará en todos los nodos para recoger
  # sus métricas de CPU, RAM, disco y red.
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi
