apiVersion: v1
kind: ConfigMap
metadata:
    name: homepage
    labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/instance: homepage
data:
    kubernetes.yaml: |
        mode: cluster
        gateway: true

    settings.yaml: |
        title: Homelab
        description: Panel privado del homelab
        language: es
        theme: dark
        color: slate
        headerStyle: clean
        statusStyle: dot
        hideVersion: true

    services.yaml: |
        - Administration:
            - Argo CD:
                icon: argo-cd.png
                href: https://argocd.ismola.dev
                description: Despliegues GitOps
            - Headlamp:
                icon: headlamp.png
                href: https://headlamp.ismola.dev
                description: Administración de Kubernetes
            - Longhorn:
                icon: longhorn.png
                href: https://longhorn.ismola.dev
                description: Almacenamiento del clúster
            - Grafana:
                icon: grafana.png
                href: https://grafana.ismola.dev
                description: Métricas y observabilidad
            - Portainer:
                icon: portainer.png
                href: http://portainer.ismola.dev
                description: Administración de contenedores Docker
            - UGos:
                icon: openmediavault.png
                href: http://h0:9999
                description: Administración del almacenamiento de h0
            - Cloudflare:
                icon: cloudflare.png
                href: https://dash.cloudflare.com
            - Oracle Cloud:
                icon: oracle.png
                href: https://www.oracle.com/cloud
            - Google Cloud Platform:
                icon: google-cloud.png
                href: https://console.cloud.google.com

        - DataBase:
            - pgAdmin:
                icon: pgadmin.png
                href: https://pgadmin.ismola.dev
                description: PostgreSQL
            - Mongo Express:
                icon: mongodb.png
                href: https://mongo-express.ismola.dev
                description: MongoDB


        - Servarr:
            - Plex:
                icon: plex.png
                href: https://plex.ismola.dev
                description: Biblioteca multimedia
            - Overseerr:
                icon: overseerr.png
                href: https://seerr.ismola.dev
                description: Solicitudes multimedia
            - Sonarr:
                icon: sonarr.png
                href: https://sonarr.ismola.dev
                description: Gestión de series
            - Radarr:
                icon: radarr.png
                href: https://radarr.ismola.dev
                description: Gestión de películas
            - Bazarr:
                icon: bazarr.png
                href: https://bazarr.ismola.dev
                description: Gestión de subtítulos
            - Prowlarr:
                icon: prowlarr.png
                href: https://prowlarr.ismola.dev
                description: Gestión de indexadores
            - Jackett:
                icon: jackett.png
                href: https://jackett.ismola.dev
                description: Proxy de indexadores
            - qBittorrent:
                icon: qbittorrent.png
                href: https://qbittorrent.ismola.dev
                description: Cliente BitTorrent
            - qBitManager:
                icon: mdi-download-network-outline
                href: https://qbitmanage.ismola.dev
                description: Automatización de qBittorrent

        - Networking:
            - Tailscale:
                icon: tailscale.png
                href: https://login.tailscale.com/admin/machines
            - Nginx Proxy Manager:
                icon: nginx-proxy-manager.png
                href: http://npm.ismola.dev
                description: Proxy inverso y certificados
            - Pi-hole:
                icon: pi-hole.png
                href: http://pihole.ismola.dev/admin
                description: DNS y bloqueo de publicidad
            - Router:
                icon: mdi-router-wireless
                href: http://192.168.1.1
                description: Router principal
            # - TP-Link:
            #     icon: tplink.png
            #     href: http://192.168.1.130
            #     description: Dispositivo de red TP-Link
            # - WireGuard:
            #     icon: wireguard.png
            #     href: https://wg-easy.ismola.dev
            #     description: Administración de WireGuard



        - Data Management:
            - OpenCloud:
                icon: mdi-cloud
                href: https://opencloud.ismola.dev
                description: Archivos personales
            - Immich:
                icon: immich.png
                href: https://immich.ismola.dev
                description: Fotos y vídeos
            - Duplicati:
                icon: duplicati.png
                href: https://duplicati.ismola.dev
                description: Copias de seguridad


        - Utils:
            - Zoom Villanueva de la Torre:
                icon: zoom.png
                href: https://us02web.zoom.us/j/83531341977
                description: Acceso a la reunión
            - Zoom Siryus Soporte:
                icon: zoom.png
                href: https://zoom.us/j/99721504946
                description: Acceso a la reunión
            - Mail Siryus:
                icon: mdi-email-outline
                href: https://servidor.siryus-system.com/webmail/
                description: Correo electrónico de Siryus

    widgets.yaml: |
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: k3s
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - search:
            provider: duckduckgo
            target: _blank

    bookmarks.yaml: |
        - Desarrollo:
            - Homelab:
                - icon: github.png
                  href: https://github.com/Ismola/homelab
                  description: Repositorio GitOps
            - ismola.dev:
                - icon: mdi-web
                  href: https://ismola.dev
                  description: Web personal
            - Gott Calculator:
                - icon: mdi-calculator
                  href: https://gott-calculator.ismola.dev
            - Open Date:
                - icon: mdi-calendar-heart
                  href: https://open-date.ismola.dev
            - Sergio & Judit:
                - icon: mdi-ring
                  href: https://sj-wedding.ismola.dev
            - Cakeshop:
                - icon: mdi-cake-variant
                  href: https://cakeshop-concept.ismola.dev
            - JW Hitster:
                - icon: mdi-music-circle
                  href: https://jw-hitster.ismola.dev/es
            - Zip Hider:
                - icon: mdi-folder-zip
                  href: https://zip-hider.ismola.dev
            - Japón Landing:
                - icon: mdi-torii-gate
                  href: https://japon-landing-concept.ismola.dev
            - Login Animation:
                - icon: mdi-login-variant
                  href: https://pro-login-animacion.ismola.dev
            - Snake:
                - icon: mdi-snake
                  href: https://js-snake.ismola.dev
            - Apple Concept:
                - icon: apple.png
                  href: https://apple-concept.ismola.dev
            - African Art:
                - icon: mdi-palette
                  href: https://african-art-exhibition-concept.ismola.dev
            - Template Next:
                - icon: nextjs.png
                  href: https://template-next.ismola.dev/en
            - Calendar Hub:
                - icon: mdi-calendar-sync
                  href: https://calendar-subscription-hub.ismola.dev
            - Trivial:
                - icon: mdi-code-tags
                  href: https://trivial-php.ismola.dev

    docker.yaml: ""
    proxmox.yaml: ""
    custom.css: ""
    custom.js: ""
