---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-subscription-hub-web
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: calendar-subscription-hub-web
spec:
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: calendar-subscription-hub-web
  template:
    metadata:
      labels:
        app: calendar-subscription-hub-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ismola/calendar-subscription-hub-web:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: calendar-subscription-hub-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-subscription-hub-db
                  key: DATABASE_URL
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
              ephemeral-storage: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: calendar-subscription-hub-web
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: calendar-subscription-hub-web
spec:
  type: ClusterIP
  selector:
    app: calendar-subscription-hub-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-subscription-hub-worker
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: calendar-subscription-hub-worker
spec:
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: calendar-subscription-hub-worker
  template:
    metadata:
      labels:
        app: calendar-subscription-hub-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/ismola/calendar-subscription-hub-worker:main
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: calendar-subscription-hub-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-subscription-hub-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calendar-subscription-hub
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: gateway-system
  hostnames:
    - "calendar-subscription-hub.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: calendar-subscription-hub-web
          port: 3000
          weight: 1
