apiVersion: v1
kind: Namespace
metadata:
  name: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-subscription-hub-config
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  REDIS_URL: "redis://redis:6379"
  APP_BASE_URL: "https://calendar-subscription-hub.ismola.dev"

  ASISMETRO_API_BASE_URL: "http://asismetro-automations:3000"

  APP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
  SESSION_SECRET: "dev-session-secret"

  ASISMETRO_BEARER_TOKEN: "sample"
  VALID_TOKEN: "sample"

  DEFAULT_REFRESH_MINUTES: "360"
  STAGE: "production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
              ephemeral-storage: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asismetro-automations
  namespace: calendar-subscription-hub
spec:
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: asismetro-automations
  template:
    metadata:
      labels:
        app: asismetro-automations
    spec:
      containers:
        - name: asismetro-automations
          image: ghcr.io/ismola/asismetro-automations:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: STAGE
              valueFrom:
                configMapKeyRef:
                  name: calendar-subscription-hub-config
                  key: STAGE
            - name: VALID_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: calendar-subscription-hub-config
                  key: VALID_TOKEN
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 2Gi

          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: temp-downloads
              mountPath: /app/temp_downloads
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
        - name: temp-downloads
          emptyDir:
            sizeLimit: 1Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: asismetro-automations
  namespace: calendar-subscription-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  type: ClusterIP
  selector:
    app: asismetro-automations
  ports:
    - name: http
      port: 3000
      targetPort: 3000


