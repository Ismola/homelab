apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: calendar-subscription-hub-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: calendar-subscription-hub-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      # Por defecto, el periodo de cooldown para desescalar es de 5 minutos.
      # Lo establecemos en 3 minutos.
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
---
