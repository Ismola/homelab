apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: apple-concept
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 96Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 512Mi
