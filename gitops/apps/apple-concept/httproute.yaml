apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apple-concept
  namespace: apple-concept
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik
      namespace: gateway-system
  hostnames:
    - "apple-concept.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: apple-concept
          port: 80
          weight: 1
