apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pro-login-animacion
  namespace: pro-login-animacion
spec:
  parentRefs:
    - name: traefik
      namespace: gateway-system
  hostnames:
    - "pro-login-animacion.ismola.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pro-login-animacion
          port: 80
