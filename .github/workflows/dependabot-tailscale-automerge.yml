name: Update Tailscale automatically

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tailscale-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/helm/gitops/apps/tailscale/')
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el alcance de la actualización
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          changed_files="$(gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR}/files" \
            --jq '.[].filename')"

          if [ -z "${changed_files}" ]; then
            echo "La PR no contiene archivos" >&2
            exit 1
          fi

          unexpected_files="$(printf '%s\n' "${changed_files}" | \
            grep -Ev '^gitops/apps/tailscale/(Chart\.yaml|Chart\.lock|charts/tailscale-operator-[^/]+\.tgz)$' || true)"

          if [ -n "${unexpected_files}" ]; then
            echo "Dependabot modificó archivos fuera del alcance permitido:" >&2
            printf '%s\n' "${unexpected_files}" >&2
            exit 1
          fi

      - name: Descargar la revisión de Dependabot
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Validar el chart
        run: |
          helm dependency build gitops/apps/tailscale
          helm lint gitops/apps/tailscale
          helm template tailscale-operator gitops/apps/tailscale \
            --namespace tailscale \
            --api-versions tailscale.com/v1alpha1/ProxyClass \
            >/dev/null

      - name: Fusionar la actualización
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge "${PR}" --repo "${REPOSITORY}" --squash
