name: Update inventory diagram

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: update-inventory-diagram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Generate diagram
        run: python scripts/docs/generate-inventory-diagram.py

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "The inventory diagram is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update inventory diagram"
          git push
