# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  # El chart y las imágenes del operador comparten versión. Dependabot actualiza
  # Chart.yaml y Chart.lock en una única PR, que se valida y fusiona mediante el
  # workflow dependabot-tailscale-automerge.yml.
  - package-ecosystem: "helm"
    directory: "/gitops/apps/tailscale"
    schedule:
      interval: daily
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 1
    groups:
      tailscale:
        patterns:
          - "tailscale-operator"
