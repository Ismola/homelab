all:
  vars:
    ansible_user: root

  children:
    production:
      vars:
        env: production
      hosts:
        v3:
          ansible_host: v3.elver-chicken.ts.net
          role: k3s_server | k3s_worker
          provider: oracle
          ram_gb: 24
          cpu: 4
          arch: arm64
          distro: ubuntu

        v1:
          ansible_host: v1.elver-chicken.ts.net
          role: k3s_worker
          provider: oracle
          ram_gb: 1
          cpu: 1
          arch: amd64
          distro: ubuntu

        v2:
          ansible_host: v2.elver-chicken.ts.net
          role: k3s_worker
          provider: oracle
          ram_gb: 1
          cpu: 1
          arch: amd64
          distro: ubuntu

        v4:
          ansible_host: v4.elver-chicken.ts.net
          role: k3s_worker
          provider: google
          ram_gb: 1
          cpu: 1
          arch: amd64
          distro: debian

        v5:
          ansible_host: v5.elver-chicken.ts.net
          role: k3s_worker
          provider: oracle
          ram_gb: 1
          cpu: 1
          arch: amd64
          distro: ubuntu

        v6:
          ansible_host: v6.elver-chicken.ts.net
          role: k3s_worker
          provider: oracle
          ram_gb: 1
          cpu: 1
          arch: amd64
          distro: ubuntu
        
        v7:
          ansible_host: v7.elver-chicken.ts.net
          role: k3s_server
          provider: oracle
          ram_gb: 6
          cpu: 1
          arch: amd64
          distro: ubuntu
        
        v8:
          ansible_host: v8.elver-chicken.ts.net
          role: k3s_server
          provider: oracle
          ram_gb: 6
          cpu: 1
          arch: amd64
          distro: ubuntu

        rpi:
          ansible_host: rpi.elver-chicken.ts.net
          role: k3s_worker
          provider: homelab
          ram_gb: 2
          cpu: 4
          arch: arm64
          distro: debian

    staging:
      vars:
        env: staging
      hosts:
        vm5:
          ansible_host: vm5.elver-chicken.ts.net
          role: rancher_node
          provider: vmware
          ram_gb: 4
          cpu: 1
          arch: amd64
          distro: ubuntu

        vm3:
          ansible_host: vm3.elver-chicken.ts.net
          role: k3s_server
          provider: vmware
          ram_gb: 3
          cpu: 1
          arch: amd64
          distro: ubuntu

        vm1:
          ansible_host: vm1.elver-chicken.ts.net
          role: k3s_worker
          provider: vmware
          ram_gb: 1
          cpu: 1
          arch: amd64
          distro: ubuntu

        vm4:
          ansible_host: vm4.elver-chicken.ts.net
          role: k3s_worker
          provider: vmware
          ram_gb: 1
          cpu: 1
          arch: amd64
          distro: debian

    k3s_cp:
      hosts:
        v3:
        vm3:
        v7:
        v8:

    k3s_cp_stg:
      hosts:
        vm3:

    k3s_cp_prod:
      hosts:
        v3:
        v7:
        v8:

    k3s_workers:
      hosts:
        v1:
        v2:
        v4:
        v5:
        v6:
        rpi:
        vm1:
        vm4:

    k3s_workers_stg:
      hosts:
        vm1:
        vm4:

    k3s_workers_prod:
      hosts:
        v1:
        v2:
        v4:
        v5:
        v6:
        rpi:

    rancher_node:
      hosts:
        vm5:
